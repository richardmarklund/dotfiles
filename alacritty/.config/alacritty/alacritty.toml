import = [
   # "~/.config/alacritty/catppuccin-macchiato.toml"
   "~/.config/alacritty/catppuccin-mocha.toml"
]
[env]
TERM = "xterm-256color"


[window]
padding.x = 10
padding.y = 10
opacity= 0.9

[font.normal]
family = "MesloLGL Nerd Font"
style = "Regular"

[font.italic]
family = "MesloLGL Nerd Font"
style = "Italic"

[font.bold]
family = "MesloLGL Nerd Font"
style = "Bold"

[font.bold_italic]
family = "MesloLGL Nerd Font"
style = "Bold Italic"

[[keyboard.bindings]]
action = "ToggleViMode"
key = "a"
mods = "Super"
mode = "AppCursor"
